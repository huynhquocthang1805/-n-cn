<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1152" width="1180" height="1152"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img"
     aria-label="Pipeline PINN-SOH: mạng ánh xạ từng chu kỳ độc lập sang SOH; cấu trúc quỹ đạo chỉ vào qua các loss vật lý tính trên cặp chu kỳ cùng cell">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4a52"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#177a68"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2571f"/>
    </marker>
  </defs>

  <style>
    .sec  { fill:none; stroke:#c3ccd2; stroke-width:1.2; rx:8 }
    .box  { fill:#ffffff; stroke:#7d8b94; stroke-width:1.1 }
    .boxd { fill:#f2f5f6; stroke:#9aa6ad; stroke-width:1.1 }
    .boxT { fill:#e8f3ef; stroke:#177a68; stroke-width:1.3 }
    .boxO { fill:#fdeee5; stroke:#c2571f; stroke-width:1.3 }
    .boxB { fill:#e9f1fb; stroke:#2a78d6; stroke-width:1.2 }
    .t    { fill:#1b2330; font-size:11.5px }
    .tb   { fill:#1b2330; font-size:12px; font-weight:600 }
    .ts   { fill:#55636d; font-size:10.5px }
    .tm   { fill:#1b2330; font-size:11px; font-family:DejaVu Sans Mono, Consolas, monospace }
    .tT   { fill:#0f5a4d; font-size:11.5px }
    .tO   { fill:#a0450f; font-size:11.5px }
    .hdr  { fill:#3d4a52; font-size:12.5px; font-weight:700; letter-spacing:.6px }
    .ln   { stroke:#3d4a52; stroke-width:1.4; fill:none }
    .lnT  { stroke:#177a68; stroke-width:1.6; fill:none }
    .lnO  { stroke:#c2571f; stroke-width:1.6; fill:none; stroke-dasharray:5 3 }
  </style>

  <!-- ══════════════════════ 1. DỮ LIỆU ══════════════════════ -->
  <rect class="sec" x="16" y="34" width="1148" height="196"/>
  <text class="hdr" x="30" y="26">1 · DỮ LIỆU — pinnsoh/data.py</text>

  <rect class="box" x="30" y="52" width="162" height="158" rx="5"/>
  <text class="tb" x="40" y="72">CSV, 1 tệp = 1 cell</text>
  <text class="ts" x="40" y="90">1 hàng = 1 chu kỳ</text>
  <line x1="40" y1="98" x2="182" y2="98" stroke="#c3ccd2"/>
  <text class="t"  x="40" y="115">16 đặc trưng sạc</text>
  <text class="ts" x="40" y="131">mean, std, kurtosis, skew,</text>
  <text class="ts" x="40" y="145">Q, thời gian, slope, entropy</text>
  <text class="ts" x="40" y="159">— cho cả V và I (CC + CV)</text>
  <text class="t"  x="40" y="180">+ capacity (nhãn)</text>
  <text class="ts" x="40" y="198">387 cell / 4 bộ</text>

  <rect class="box" x="206" y="76" width="112" height="110" rx="5"/>
  <text class="tb" x="216" y="96">Lọc 3σ</text>
  <text class="ts" x="216" y="114">bỏ hàng ∞/NaN</text>
  <text class="ts" x="216" y="129">bỏ hàng |z| &gt; 3</text>
  <text class="ts" x="216" y="144">trên mọi đặc trưng</text>
  <text class="tO" x="216" y="164">chỉ xét đặc trưng,</text>
  <text class="tO" x="216" y="178">không xét nhãn</text>

  <rect class="box" x="330" y="66" width="152" height="130" rx="5"/>
  <text class="tb" x="340" y="86">Chia THEO CELL</text>
  <text class="t"  x="340" y="106">70 / 15 / 15</text>
  <text class="ts" x="340" y="123">phân tầng theo nhóm</text>
  <text class="ts" x="340" y="137">protocol; nhóm &lt; 4 cell</text>
  <text class="ts" x="340" y="151">gộp chung</text>
  <text class="ts" x="340" y="171">assert: không cell nào</text>
  <text class="ts" x="340" y="185">ở hai tập</text>

  <rect class="box" x="498" y="60" width="164" height="142" rx="5"/>
  <text class="tb" x="508" y="80">Chọn cell mang nhãn</text>
  <text class="ts" x="508" y="98">trong 70 % train, lấy</text>
  <text class="ts" x="508" y="112">f · (tổng cell) làm nhãn</text>
  <text class="ts" x="508" y="126">round-robin theo nhóm</text>
  <rect class="boxB" x="508" y="136" width="70" height="26" rx="3"/>
  <text class="t" x="516" y="153">S_lab</text>
  <rect class="boxO" x="586" y="136" width="66" height="26" rx="3"/>
  <text class="tO" x="594" y="153">S_unl</text>
  <text class="ts" x="508" y="180">S_unl: CHỈ có đặc trưng,</text>
  <text class="ts" x="508" y="193">không có nhãn dung lượng</text>

  <rect class="box" x="678" y="66" width="182" height="130" rx="5"/>
  <text class="tb" x="688" y="86">Chuẩn hoá (nhân quả)</text>
  <text class="ts" x="688" y="104">z-score fit TRÊN CELL TRAIN</text>
  <text class="ts" x="688" y="119">(chỉ đặc trưng, không nhãn)</text>
  <text class="tm" x="688" y="139">t = N / 1000</text>
  <text class="tO" x="688" y="157">hằng số toàn cục —</text>
  <text class="tO" x="688" y="170">KHÔNG min-max theo cell</text>
  <text class="ts" x="688" y="188">biến thể: first_cycle</text>

  <rect class="boxd" x="876" y="66" width="276" height="130" rx="5"/>
  <text class="tb" x="886" y="86">PointSet — n = tổng số chu kỳ</text>
  <text class="tm" x="886" y="108">X [n, 16]   đặc trưng đã chuẩn hoá</text>
  <text class="tm" x="886" y="126">T [n, 1]    chu kỳ / 1000</text>
  <text class="tm" x="886" y="144">Y [n, 1]    SOH = C / C_danh_định</text>
  <text class="tm" x="886" y="162">invT [n,1]  1 / T(K)</text>
  <text class="tm" x="886" y="180">cell, start, end  → ranh giới cell</text>

  <path class="ln" d="M192 131 H206" marker-end="url(#ar)"/>
  <path class="ln" d="M318 131 H330" marker-end="url(#ar)"/>
  <path class="ln" d="M482 131 H498" marker-end="url(#ar)"/>
  <path class="ln" d="M662 131 H678" marker-end="url(#ar)"/>
  <path class="ln" d="M860 131 H876" marker-end="url(#ar)"/>

  <circle cx="1140" cy="52" r="13" fill="#177a68"/>
  <text x="1140" y="57" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>

  <!-- ══════════════════════ 2. MẠNG ══════════════════════ -->
  <rect class="sec" x="16" y="268" width="1148" height="266"/>
  <text class="hdr" x="30" y="260">2 · MẠNG — pinnsoh/models.py · 9 060 tham số (mlp) / 9 532 (mono)</text>

  <!-- solution net -->
  <rect class="boxB" x="30" y="286" width="560" height="230" rx="6"/>
  <text class="tb" x="42" y="306">MẠNG NGHIỆM  u = F_φ(x, t)   — dùng cả khi huấn luyện lẫn suy luận</text>

  <rect class="box" x="42" y="318" width="96" height="52" rx="4"/>
  <text class="tm" x="52" y="338">concat</text>
  <text class="tm" x="52" y="356">[x₁₆ | t₁]</text>
  <text class="ts" x="52" y="384">= 17 chiều</text>

  <rect class="box" x="154" y="318" width="196" height="52" rx="4"/>
  <text class="t"  x="164" y="337">MLP mặc định</text>
  <text class="tm" x="164" y="356">17→64→64→32→1</text>
  <text class="ts" x="154" y="384">act ∈ silu (mặc định), tanh,</text>
  <text class="ts" x="154" y="398">sin, gelu, snake</text>

  <rect class="boxT" x="366" y="318" width="212" height="52" rx="4"/>
  <text class="tT"  x="376" y="337">HOẶC đầu ra đơn điệu</text>
  <text class="tm"  x="376" y="356">trunk 16→64→64→32 → head</text>

  <rect class="boxT" x="366" y="384" width="212" height="118" rx="4"/>
  <text class="tT" x="376" y="402">u = u₀(x) − Σₖ sₖ(x)·</text>
  <text class="tT" x="376" y="418">        softplus(ωₖ·t + φₖ(x))</text>
  <text class="ts" x="376" y="438">K = 8 hàm cơ sở</text>
  <text class="ts" x="376" y="453">sₖ ≥ 0, ωₖ ≥ 0 (đều qua softplus)</text>
  
  <text class="tT" x="376" y="474">⟹ ∂u/∂t ≤ 0 với MỌI tham số</text>
  <text class="ts" x="376" y="490">u₀ ∈ [0.40, 1.15] qua sigmoid</text>

  <rect class="boxd" x="42" y="410" width="308" height="92" rx="4"/>
  <text class="tb" x="52" y="428">Điểm mấu chốt</text>
  <text class="t"  x="52" y="448">Mạng ánh xạ MỘT chu kỳ → MỘT giá trị SOH.</text>
  <text class="t"  x="52" y="465">Không CNN, không attention, không RNN —</text>
  <text class="t"  x="52" y="482">mạng không hề nhìn thấy chuỗi.</text>
  <text class="tO" x="52" y="498">Cấu trúc quỹ đạo vào qua LOSS (mục 3).</text>

  <path class="ln" d="M138 344 H154" marker-end="url(#ar)"/>
  <path class="ln" d="M350 344 H366" marker-end="url(#ar)"/>
  <path class="lnT" d="M472 370 V384" marker-end="url(#arT)"/>

  <!-- dynamics -->
  <rect class="boxT" x="606" y="286" width="546" height="230" rx="6"/>
  <text class="tb" x="618" y="306">ĐỘNG HỌC XÁM  r(x, u, T) ≥ 0  — CHỈ dùng trong loss, không dùng khi suy luận</text>

  <rect class="box" x="618" y="318" width="160" height="52" rx="4"/>
  <text class="t"  x="628" y="337">rate_net</text>
  <text class="tm" x="628" y="356">16→32→32→1</text>

  <rect class="box" x="794" y="318" width="120" height="52" rx="4"/>
  <text class="tm" x="804" y="338">softplus(·)</text>
  <text class="tT" x="804" y="357">≥ 0 luôn</text>

  <rect class="box" x="930" y="318" width="102" height="52" rx="4"/>
  <text class="tm" x="940" y="338">× e^(λ(1−u))</text>
  <text class="ts" x="940" y="357">knee</text>

  <rect class="box" x="1048" y="318" width="92" height="52" rx="4"/>
  <text class="tm" x="1056" y="338">× A(T)</text>
  <text class="ts" x="1056" y="357">Arrhenius</text>

  <rect class="boxd" x="618" y="392" width="522" height="110" rx="4"/>
  <text class="tm" x="630" y="412">r = softplus(MLP_θ(x)) · exp(λ(1−u)) · exp(−Eₐ/R · (1/T − 1/T_ref))</text>
  <text class="t"  x="630" y="434">λ, Eₐ: hai vô hướng học được, dùng chung cho cả bộ dữ liệu (đọc được như tham số vật lý)</text>
  <text class="t"  x="630" y="452">Bộ đơn nhiệt độ ⟹ A(T) = 1 và Eₐ không nhận gradient — đúng như mong đợi</text>
  <text class="tO" x="630" y="474">Khác PINN4SOH: mạng động học KHÔNG nhận ∂u/∂t làm đầu vào,</text>
  <text class="tO" x="630" y="491">nên phần dư không thể tự triệt tiêu.</text>

  <path class="ln" d="M778 344 H794" marker-end="url(#ar)"/>
  <path class="ln" d="M914 344 H930" marker-end="url(#ar)"/>
  <path class="ln" d="M1032 344 H1048" marker-end="url(#ar)"/>

  <circle cx="1140" cy="286" r="13" fill="#177a68"/>
  <text x="1140" y="291" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>

  <!-- ══════════════════════ 3. MỘT BƯỚC HUẤN LUYỆN ══════════════════════ -->
  <rect class="sec" x="16" y="572" width="1148" height="352"/>
  <text class="hdr" x="30" y="564">3 · MỘT BƯỚC HUẤN LUYỆN — pinnsoh/train.py, lặp tối đa 4 000 lần</text>

  <!-- data stream -->
  <rect class="boxB" x="30" y="590" width="238" height="126" rx="5"/>
  <text class="tb" x="40" y="610">Batch ĐIỂM — cần nhãn</text>
  <text class="t"  x="40" y="630">512 điểm ngẫu nhiên</text>
  <text class="t"  x="40" y="647">rút từ S_lab</text>
  <text class="ts" x="40" y="666">(điểm rời rạc, không theo</text>
  <text class="ts" x="40" y="680">thứ tự, có thể khác cell)</text>
  <text class="tm" x="40" y="704">x[512,16], t[512,1], y[512,1]</text>

  <!-- pair stream -->
  <rect class="boxO" x="30" y="734" width="238" height="172" rx="5"/>
  <text class="tb" x="40" y="754">Batch CẶP — KHÔNG cần nhãn</text>
  <text class="t"  x="40" y="774">256 cặp từ S_lab</text>
  <text class="tO" x="40" y="792">+ 256 cặp từ S_unl</text>
  <line x1="40" y1="802" x2="258" y2="802" stroke="#c2571f" stroke-dasharray="3 3"/>
  <text class="t"  x="40" y="820">Mỗi cặp (N, N+h):</text>
  <text class="ts" x="40" y="838">• cùng MỘT cell (dùng start/end)</text>
  <text class="ts" x="40" y="854">• h ~ U{5, …, 50} chu kỳ</text>
  <text class="ts" x="40" y="870">• cắt tại chu kỳ cuối của cell</text>
  <text class="tm" x="40" y="894">x₁,t₁,x₂,t₂, invT, first</text>

  <path class="ln"  d="M268 653 H310" marker-end="url(#ar)"/>
  <path class="lnO" d="M268 820 H310" marker-end="url(#arO)"/>

  <!-- loss terms -->
  <rect class="box" x="310" y="606" width="416" height="60" rx="5"/>
  <text class="tb" x="320" y="626">L_data  — số hạng DUY NHẤT cần nhãn</text>
  <text class="tm" x="320" y="650">MSE( u(x, t),  y )</text>

  <rect class="boxT" x="310" y="682" width="416" height="66" rx="5"/>
  <text class="tb" x="320" y="702">L_ode  (không nhãn) — dạng Euler</text>
  <text class="tm" x="320" y="724">[ u(N+h) − u(N) + r(x_N, u_N, T)·(t₂−t₁) ]²</text>
  <text class="ts" x="320" y="741">biến thể: fd (chia Δt) · autograd (∂u/∂t)</text>

  <rect class="boxT" x="310" y="764" width="416" height="56" rx="5"/>
  <text class="tb" x="320" y="784">L_mono  (không nhãn)</text>
  <text class="tm" x="320" y="806">ReLU( u(N+h) − u(N) − ε ),   ε = 0.002</text>

  <rect class="boxT" x="310" y="836" width="416" height="70" rx="5"/>
  <text class="tb" x="320" y="856">L_range  (không nhãn)</text>
  <text class="tm" x="320" y="876">ReLU(u−1.15) + ReLU(0.4−u)</text>
  <text class="tm" x="320" y="895">+ first·[ ReLU(u−1.10) + ReLU(0.85−u) ]</text>

  <path class="ln"  d="M726 636 H772" marker-end="url(#ar)"/>
  <path class="lnT" d="M726 715 H772" marker-end="url(#arT)"/>
  <path class="lnT" d="M726 792 H772" marker-end="url(#arT)"/>
  <path class="lnT" d="M726 871 H772" marker-end="url(#arT)"/>

  <!-- total -->
  <rect class="boxd" x="772" y="606" width="380" height="150" rx="5"/>
  <text class="tb" x="784" y="626">TỔNG</text>
  <text class="tm" x="784" y="650">L = L_data</text>
  <text class="tm" x="784" y="670">  + w(s)·( α·L_ode + β·L_mono + γ·L_range )</text>
  <text class="t"  x="784" y="694">α = 2, β chọn theo validation, γ = 1</text>
  <text class="tm" x="784" y="716">w(s) = w_adapt · min(1, s / (0.2·S))</text>
  <text class="ts" x="784" y="734">warm-up: vật lý tăng dần trong 20 % bước đầu</text>
  <text class="tT" x="784" y="750">w_adapt = (1 − f_nhãn) + 0.15   (tuỳ chọn)</text>

  <rect class="box" x="772" y="772" width="380" height="134" rx="5"/>
  <text class="tb" x="784" y="792">Cập nhật</text>
  <text class="t"  x="784" y="812">AdamW, lr 2e-3 → cosine → 5 %</text>
  <text class="t"  x="784" y="830">clip_grad_norm = 5</text>
  <line x1="784" y1="842" x2="1140" y2="842" stroke="#c3ccd2"/>
  <text class="t"  x="784" y="862">Mỗi 100 bước: đánh giá trên tập VAL</text>
  <text class="t"  x="784" y="880">giữ checkpoint có MAE val thấp nhất</text>
  <text class="t"  x="784" y="898">dừng sớm sau 12 lần không cải thiện</text>

  <path class="ln" d="M962 756 V772" marker-end="url(#ar)"/>

  <circle cx="252" cy="740" r="13" fill="#c2571f"/>
  <text x="252" y="745" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
  <circle cx="1140" cy="590" r="13" fill="#177a68"/>
  <text x="1140" y="595" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>

  <!-- ══════════════════════ 4. SUY LUẬN & ĐÁNH GIÁ ══════════════════════ -->
  <rect class="sec" x="16" y="962" width="1148" height="152"/>
  <text class="hdr" x="30" y="954">4 · SUY LUẬN &amp; ĐÁNH GIÁ — pinnsoh/metrics.py · decode.py</text>

  <rect class="box" x="30" y="980" width="200" height="118" rx="5"/>
  <text class="tb" x="40" y="1000">Nạp checkpoint tốt nhất</text>
  <text class="t"  x="40" y="1020">Suy luận: CHỈ mạng nghiệm</text>
  <text class="tm" x="40" y="1040">p = u(X_test, T_test)</text>
  <text class="ts" x="40" y="1060">từng chu kỳ độc lập,</text>
  <text class="ts" x="40" y="1074">một lượt forward duy nhất</text>
  <text class="tO" x="40" y="1092">động học r KHÔNG tham gia</text>

  <rect class="box" x="246" y="980" width="222" height="118" rx="5"/>
  <text class="tb" x="256" y="1000">Chỉ số theo ĐIỂM</text>
  <text class="t"  x="256" y="1020">MAE · RMSE · MAPE · R²</text>
  <text class="t"  x="256" y="1038">MaxAE</text>
  <text class="t"  x="256" y="1058">MAE_late (chỉ SOH ≤ 0.90)</text>
  <text class="ts" x="256" y="1078">vùng ra quyết định thay pin</text>

  <rect class="box" x="484" y="980" width="240" height="118" rx="5"/>
  <text class="tb" x="494" y="1000">Chỉ số theo CELL</text>
  <text class="t"  x="494" y="1020">MAE_cell (mỗi cell 1 phiếu)</text>
  <text class="t"  x="494" y="1038">MAE_cell_max — cell tệ nhất</text>
  <text class="t"  x="494" y="1058">EOL_MAE (ngưỡng 0.85)</text>
  <text class="ts" x="494" y="1078">+ EOL_cov: tỉ lệ cell cắt ngưỡng</text>

  <rect class="boxT" x="740" y="980" width="228" height="118" rx="5"/>
  <text class="tb" x="750" y="1000">Chỉ số HỢP LÝ VẬT LÝ</text>
  <text class="t"  x="750" y="1020">MonoViol = Σ bước tăng ngược</text>
  <text class="t"  x="750" y="1038">Jitter = mean |u(N+1) − u(N)|</text>
  <text class="tT" x="750" y="1062">Không cần nhãn ⟹ đo được</text>
  <text class="tT" x="750" y="1078">trên cell chưa đo dung lượng</text>
  <text class="ts" x="750" y="1092">→ giám sát khi triển khai</text>

  <rect class="boxd" x="984" y="980" width="168" height="118" rx="5"/>
  <text class="tb" x="994" y="1000">Tuỳ chọn</text>
  <text class="t"  x="994" y="1020">Giải mã PAVA</text>
  <text class="ts" x="994" y="1036">chiếu quỹ đạo mỗi cell</text>
  <text class="ts" x="994" y="1050">lên dãy không tăng</text>
